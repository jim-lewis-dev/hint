[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "human-interrupt"
version = "0.1.5"
description = "Named local and remote desktop signals with optional scheduling and wakeup"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jim Lewis"}]
dependencies = ["agent-messenger @ git+https://github.com/jim-lewis-dev/agent_messenger.git@ec34a8cb25623a6b7675830d739fa82c4dcbf157"]

[project.scripts]
hint = "hint:main"

[tool.setuptools]
py-modules = [
  "hint",
  "hint_config",
  "hint_signals",
  "hint_playback",
  "hint_network",
  "hint_completion",
]

[tool.setuptools.data-files]
"share/hint" = ["completions/hint.bash", "hint.service", "rtc_helper.py", "config.example.json"]

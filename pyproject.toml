[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "human-interrupt"
version = "0.1.6"
description = "Launch reminders, media, messages and commands locally, remotely or on a schedule"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jim Lewis"}]
dependencies = ["agent-messenger @ git+https://github.com/jim-lewis-dev/agent_messenger.git@fdfa9d9ce4c0bd3a6fcfee7177b1fec0b2359e8e", "nats-py==2.16.0"]

[project.urls]
Homepage = "https://github.com/jim-lewis-dev/hint"
Repository = "https://github.com/jim-lewis-dev/hint"
Issues = "https://github.com/jim-lewis-dev/hint/issues"

[project.scripts]
hint = "hint:main"

[tool.setuptools]
py-modules = [
  "hint",
  "hint_config",
  "hint_signals",
  "hint_playback",
  "hint_network",
  "hint_completion",
  "hint_runtime",
  "hint_popup",
  "hint_ready",
]

[tool.setuptools.data-files]
"share/hint" = ["completions/hint.bash", "hint.service", "rtc_helper.py", "config.example.json"]
